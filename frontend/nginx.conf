# 착착트립 nginx 설정 (11/16 ④ 신예지)
#   화면 파일을 주고, /api로 시작하는 요청은 서버(backend 컨테이너)로 넘겨요
#   화면과 API가 같은 주소라서 로그인 쿠키가 그대로 붙어요 (개발할 때 vite proxy와 같은 방식)
server {
    listen 80;
    root /usr/share/nginx/html;

    # 사진·영상 올리기 최대 500MB (application.properties의 max-request-size와 같게)
    client_max_body_size 500m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 일정 짜기는 진행 알림(SSE)을 조금씩 보내요 → 모아서 보내지 않고 바로바로 넘김
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        # Gemini 응답이 길게 걸려도 끊지 않게 (기본 60초)
        proxy_read_timeout 300s;
    }

    # /trips/3, /s/공유코드 같은 화면 주소를 새로고침해도 index.html을 줘서 Vue 라우터가 처리
    location / {
        try_files $uri $uri/ /index.html;
    }
}
